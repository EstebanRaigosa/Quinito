<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A84FF" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Polla — Mundial 2026</title>

  <!-- Design System -->
  <link rel="stylesheet" href="design-system/tokens.css">
  <link rel="stylesheet" href="design-system/components.css">

  <style>
    /* Estilos de arranque — evitan flash de contenido sin estilos */
    #app { min-height: 100dvh; }
    .loading-screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-gradient);
    }
    .loading-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--color-accent);
      animation: loading-bounce 0.8s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.16s; }
    .loading-dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes loading-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .loading-dots { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="loading-dots">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
    </div>
  </div>

  <!-- Toast container (fuera del app para no parpadear) -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Data (expone window.POLLA) -->
  <script src="data.js"></script>
  <!-- App principal -->
  <script src="app.js"></script>
</body>
</html>
