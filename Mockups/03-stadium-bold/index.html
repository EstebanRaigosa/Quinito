<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Polla — Mundial 2026</title>
  <meta name="description" content="Quinielas del Mundial 2026 con tus amigos y colegas">
  <meta name="theme-color" content="#050a0e">

  <!-- Fuentes (CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Design System -->
  <link rel="stylesheet" href="design-system/tokens.css">
  <link rel="stylesheet" href="design-system/components.css">

  <style>
    /* Estilos adicionales de la app — aquí van overrides específicos */

    /* === HERO de Login === */
    .login-hero {
      background: var(--grad-scoreboard);
      padding: var(--space-10) var(--space-6) var(--space-8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .login-hero::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -20%;
      width: 140%;
      height: 200%;
      background: radial-gradient(ellipse at 60% 40%, rgba(180,255,0,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(14,165,233,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .login-logo {
      font-family: var(--font-display);
      font-size: 4rem;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--c-pitch-50);
      position: relative;
    }
    .login-logo span {
      color: var(--c-lime-neon);
      text-shadow: var(--shadow-neon);
    }
    .login-tagline {
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: var(--tracking-widest);
      color: var(--text-secondary);
      margin-top: var(--space-2);
      position: relative;
    }
    .login-form-wrap {
      padding: var(--space-6) var(--space-4);
      max-width: 400px;
      margin: 0 auto;
    }
    .login-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      background: var(--bg-raised);
      border-radius: var(--radius-lg);
      padding: 3px;
      margin-bottom: var(--space-6);
    }
    .login-tab-btn {
      padding: var(--space-2) var(--space-4);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: all var(--duration-fast);
      min-height: 40px;
    }
    .login-tab-btn.active {
      background: var(--accent-primary);
      color: var(--c-pitch-950);
    }

    /* === DASHBOARD === */
    .dashboard-greeting {
      background: var(--grad-hero);
      padding: var(--space-6) var(--space-4) var(--space-8);
      position: relative;
      overflow: hidden;
    }
    .dashboard-greeting::after {
      content: 'MUNDIAL 2026';
      position: absolute;
      right: -20px;
      bottom: -10px;
      font-family: var(--font-display);
      font-size: 5rem;
      line-height: 1;
      color: rgba(255,255,255,0.03);
      white-space: nowrap;
      pointer-events: none;
    }
    .dashboard-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      padding: 0 var(--space-4);
      margin-top: calc(-1 * var(--space-4));
    }
    .action-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      cursor: pointer;
      transition: all var(--duration-base);
      box-shadow: var(--shadow-md);
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      color: inherit;
    }
    .action-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-accent);
    }
    .action-card-icon {
      font-size: 2rem;
      line-height: 1;
    }
    .action-card-label {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      color: var(--text-primary);
      text-align: center;
    }

    /* === GRUPO CARD en dashboard === */
    .grupo-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      cursor: pointer;
      transition: all var(--duration-base);
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }
    .grupo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 4px;
      background: var(--grad-accent);
    }
    .grupo-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .grupo-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .grupo-card-name {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-base);
      text-transform: uppercase;
      letter-spacing: var(--tracking-tight);
      color: var(--text-primary);
      flex: 1;
      padding-right: var(--space-2);
    }
    .grupo-card-meta {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .grupo-card-stat {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
    .grupo-card-pos {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      color: var(--accent-primary);
      line-height: 1;
    }

    /* === GRUPO HEADER === */
    .grupo-header {
      background: var(--grad-scoreboard);
      padding: var(--space-4) var(--space-4) var(--space-6);
      position: relative;
      overflow: hidden;
    }
    .grupo-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 80% 20%, rgba(180,255,0,0.07) 0%, transparent 60%);
      pointer-events: none;
    }
    .grupo-header-name {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      text-transform: uppercase;
      letter-spacing: var(--tracking-tight);
      color: var(--c-pitch-50);
      line-height: 1.1;
    }

    /* === PARTIDO CARD en predicciones === */
    .partido-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: var(--space-3);
    }
    .partido-card-header {
      background: rgba(0,0,0,0.25);
      padding: var(--space-2) var(--space-3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }
    .partido-card-body {
      padding: var(--space-3) var(--space-4);
    }
    .partido-matchup {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: var(--space-2);
    }
    .partido-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
    }
    .partido-team-flag { font-size: 2rem; line-height: 1; }
    .partido-team-name {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      text-align: center;
      color: var(--text-secondary);
    }
    .partido-vs {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      color: var(--text-muted);
      text-align: center;
    }
    .partido-score-real {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      background: var(--bg-raised);
      border-radius: var(--radius-lg);
      padding: var(--space-1) var(--space-3);
    }
    .partido-score-num {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      color: var(--text-primary);
      min-width: 32px;
      text-align: center;
    }
    .partido-pred-section {
      border-top: 1px solid var(--border-subtle);
      padding: var(--space-3) var(--space-4);
      background: rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .pred-inputs {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: 1;
    }
    .pred-disabled-msg {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-style: italic;
      flex: 1;
    }

    /* === TOOLTIP === */
    .tooltip-wrap {
      position: relative;
      display: inline-flex;
    }
    .tooltip-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bg-muted);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      cursor: help;
      flex-shrink: 0;
      border: 1px solid var(--border-default);
    }
    .tooltip-popup {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-raised);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      white-space: nowrap;
      max-width: 220px;
      white-space: normal;
      text-align: center;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      display: none;
      min-width: 160px;
    }
    .tooltip-wrap:hover .tooltip-popup,
    .tooltip-wrap:focus-within .tooltip-popup { display: block; }

    /* === REGLAS CARD === */
    .rules-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
    }
    .rule-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      text-align: center;
    }
    .rule-value {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      color: var(--accent-primary);
      line-height: 1;
    }
    .rule-label {
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      color: var(--text-muted);
      margin-top: var(--space-1);
    }

    /* Premios pozo */
    .prize-bar {
      height: 8px;
      border-radius: var(--radius-pill);
      overflow: hidden;
      background: var(--bg-muted);
      margin: var(--space-1) 0;
    }
    .prize-fill-1 { height: 100%; background: var(--grad-gold); border-radius: var(--radius-pill); }
    .prize-fill-2 { height: 100%; background: linear-gradient(90deg, #6b7280, #d1d5db); border-radius: var(--radius-pill); }
    .prize-fill-3 { height: 100%; background: linear-gradient(90deg, #b45309, #fbbf24); border-radius: var(--radius-pill); }

    /* === PHASE HEADER en wizard === */
    .phase-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .phase-header-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      color: var(--text-secondary);
      flex: 1;
    }
    .phase-count {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    /* === DARK/LIGHT TOGGLE === */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--bg-raised);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-pill);
      padding: var(--space-1) var(--space-3);
      cursor: pointer;
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      color: var(--text-secondary);
      transition: all var(--duration-fast);
      -webkit-tap-highlight-color: transparent;
    }
    .theme-toggle:hover { border-color: var(--accent-primary); color: var(--text-primary); }

    /* === BUSCAR PAGE === */
    .buscar-result {
      background: var(--bg-surface);
      border: 2px solid var(--accent-primary);
      border-radius: var(--radius-2xl);
      padding: var(--space-5);
      box-shadow: var(--shadow-neon);
      animation: fadeIn var(--duration-slow) var(--ease-out);
    }
    .buscar-result-name {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      text-transform: uppercase;
      color: var(--accent-primary);
    }

    /* === SUMMARY ROW === */
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-2) 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-key {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    .summary-val {
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: var(--text-sm);
      color: var(--text-primary);
    }

    /* === BRAND mark en sidebar === */
    .brand-mark {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      text-transform: uppercase;
      line-height: 1;
      color: var(--text-primary);
    }
    .brand-mark span { color: var(--accent-primary); }

    /* === Estadísticas panel === */
    .stats-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: var(--space-4);
    }
    .stats-panel-header {
      background: var(--bg-raised);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stats-panel-title {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wider);
      color: var(--text-secondary);
    }
    .stats-panel-body { padding: var(--space-4); }

    /* === WINNER DISTRIBUTION (ganador local/empate/visitante) === */
    .winner-dist {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    .winner-dist-col {
      flex: 1;
      background: var(--bg-raised);
      border-radius: var(--radius-xl);
      padding: var(--space-3) var(--space-2);
      text-align: center;
      border: 1px solid var(--border-subtle);
    }
    .winner-dist-pct {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      line-height: 1;
      margin-bottom: var(--space-1);
    }
    .winner-dist-pct.local    { color: var(--c-lime-400); }
    .winner-dist-pct.empate   { color: var(--c-pitch-300); }
    .winner-dist-pct.visitante{ color: var(--c-magenta-400); }
    .winner-dist-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      font-family: var(--font-heading);
    }

    /* Detalles de prediccion nominal */
    .pred-nominal-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-4);
      border-bottom: 1px solid var(--border-subtle);
    }
    .pred-nominal-row:last-child { border-bottom: none; }
    .pred-nominal-score {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-base);
      color: var(--text-primary);
      min-width: 48px;
      text-align: center;
    }
    .pred-nominal-name {
      flex: 1;
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    /* === Configuración admin === */
    .config-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: var(--space-4);
    }
    .config-section-header {
      padding: var(--space-3) var(--space-4);
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border-subtle);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      color: var(--text-secondary);
    }
    .config-section-body { padding: var(--space-4); }

    /* === RESPONSIVE HELPERS === */
    @media (min-width: 640px) {
      .rules-grid { grid-template-columns: repeat(3, 1fr); }
      .dashboard-actions { max-width: 400px; margin-left: auto; margin-right: auto; }
    }
    @media (min-width: 1024px) {
      .login-form-wrap { padding: var(--space-8); }
      .login-hero { padding: var(--space-16) var(--space-6) var(--space-10); }
      .login-logo { font-size: 6rem; }
      .dashboard-greeting { padding: var(--space-8) var(--space-8) var(--space-10); }
      .dashboard-actions {
        grid-template-columns: 1fr 1fr;
        max-width: 480px;
      }
    }
  </style>
</head>
<body>
  <!-- Toast container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- App root — el router renderiza aquí -->
  <div id="app" class="app-layout"></div>

  <!-- Scripts: primero data, luego app -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
